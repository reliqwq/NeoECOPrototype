// Every mod dependency resolves from a local file so a build needs no network, and none of those files
// are committed (see THIRD_PARTY_NOTICES.md). A fresh clone used to fail as a wall of unresolved
// symbols; this names the paths instead. Reading the declarations back out of this file is deliberate:
// a second list would be a second truth and would drift.
def declaredLocalJars = file('build.gradle').readLines().collectMany { line ->
    def matcher = (line =~ /^\s*(?:implementation|compileOnly|runtimeOnly)\s+files\("([^"]+\.jar)"\)/)
    matcher.find() ? [matcher.group(1)] : []
}.unique()
def absentLocalJars = declaredLocalJars.findAll { !file(it).exists() }
if (!absentLocalJars.isEmpty()) {
    throw new GradleException("Missing local dependency JARs, which this repository does not " +
            "redistribute:\n  " + absentLocalJars.join("\n  ") +
            "\nPlace lawful copies of these exact files, then run again. Sources are listed per mod in " +
            "THIRD_PARTY_NOTICES.md; the neoecoae baseline may need to come from its author.")
}


// The mod list reads the version out of neoforge.mods.toml, not out of build.gradle, and both were
// hand-written - the 1.3.7 jar shipped one that still said 1.3.6. One literal now: the token in that
// file is filled from project.version at packaging time. ReplaceTokens only looks at @token@, so the
// 'StorageHostUI$Config' comments in that file are left alone.
tasks.named('processResources', ProcessResources) {
    inputs.property('modVersion', project.version.toString())
    filesMatching('META-INF/neoforge.mods.toml') {
        filter(ReplaceTokens, tokens: [mod_version: project.version.toString()])
    }
}
tasks.named('test', Test) {
    useJUnitPlatform()
    maxHeapSize = '2G'
    // Point the cable-model contract test at any eco jar to watch it disagree with us - the way this file
    // proves it is reading upstream rather than our own assumptions:
    //   ./gradlew test -Dneoecoprototype.test.ecoJar=neoecobeta/neoecoae-21.2.9.jar
    def ecoJar = System.getProperty('neoecoprototype.test.ecoJar')
    if (ecoJar != null) {
        systemProperty 'neoecoprototype.test.ecoJar', ecoJar
    }
}

// The two contract tests below read upstream class files (and one eco interface) off the compile classpath,
// which ModDev puts on main only. Without these lines the test source set cannot see them.
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.compileClasspath
// Headless transport tests bootstrap Minecraft's registries and need its default language assets.
sourceSets.test.runtimeClasspath += files(layout.buildDirectory.file(
        'moddev/artifacts/neoforge-21.1.251-client-extra-aka-minecraft-resources.jar'))

neoForge {
    version = '21.1.251'

    runs {
        client {
            client()
        }
        server {
            server()
            // Own directory, like run-gametest below: the default gameDir is run/, which is the
            // development client's own world, so a server run saves over the world someone is
            // editing. Measured the hard way on 2026-10-07 - run/world/level.dat came back with a
            // server timestamp on it.
            gameDirectory = file('run-server')
        }
        // NeoForge 21.1.251 GameTest server; keep the namespace enabled explicitly.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'neoecoprototype'
            // 隔离运行目录：默认会复用 run/，与开发世界共用同一份 run/world，
            // 被中断的运行会留下 .neoforge-tmp 残留并让后续运行互相争抢（表现为测试卡死）。
            gameDirectory = file('run-gametest')
        }
    }

    mods {
        neoecoprototype {
            sourceSet(sourceSets.main)
        }
    }
}
