import org.apache.tools.ant.filters.ReplaceTokens

plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.4.4'
group = 'cn.dancingsnow.neoecoprototype'

base {
    archivesName = 'neoecoprototype'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    // The addon depends on the public AE2/GuideME/LDLib2 APIs and the
    // Neo ECO AE Extension runtime. The exact local development artifacts
    // are documented in README.md and are intentionally not committed.
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.appeng.io" } // AE2官方maven
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    mavenCentral()
    maven { url 'https://maven.terraformersmc.com/' }
    maven { url 'https://repo.sleeping.town/' }
}

dependencies {
    // Dev loader only; the floor we ship in neoforge.mods.toml stays [21.1.0,). Raised to the newest
    // 21.1.x because AE2 Pattern Disk requires [21.1.241,21.2.0) and eco accepts any [21.1.0,).
    implementation "net.neoforged:neoforge:21.1.251"

    // 三个运行时 mod 全部本地化到 libs/（沙箱/离线构建需要）：
    // AE2: compiled at the floor we ship. eco beta1 demanded 19.2.18 from its side and beta2 withdrew
    // that, so nothing here needs the newer jar. Compiling low makes an 18-only member fail at build
    // time instead of at a player's runtime; the trade is that a member 18 *removed* still compiles
    // here (core.localization.Tooltips lost three public static fields) and would then throw on 18.
    implementation files("libs/ae2-19.2.17.jar")               // AE2 (modId: ae2)
    implementation files("libs/guideme-21.1.1.jar")            // GuideME (AE2 强制依赖, modId: guideme)
    // LDLib2 (modId: ldlib2) - eco 21.2.1 raised its floor to [2.2.40,), and 21.2.10 and 21.2.11 both keep it,
    // so this is both
    // the compile baseline and the dev runtime. It briefly read `compileOnly 2.2.40 + runtimeOnly 2.2.42`
    // because ae2lt 2.1.2-beta4 demands [2.2.42,3.0.0) and eco 21.2.10 would not start without ae2lt; eco
    // re-uploaded 21.2.10 on 2026-10-25 (md5 444dcfc3fdab, two classes changed) with that gate in place, so
    // lightning is optional again and the runtime is back on the floor we ship. libs/ keeps the 2.2.42 jar
    // for a lightning test bed.
    implementation files("libs/ldlib2-neoforge-1.21.1-2.2.40-all.jar")
    implementation "dev.vfyjxf:taffy:1.1.3"
    implementation "org.appliedenergistics.yoga:yoga:1.0.0"
// ABI target: eco 21.2.11 (moved 2026-10-27; the previous line of sight was 21.2.10, moved 2026-10-25).
// Jar md5 26f1c96a4791, 4188 -> 4309 entries: +143 (131 classes) / -22 (15 classes) / 198 changed (173 classes).
// Class level: none of the 15 removed classes is named by our bytecode - scanned all 278 of our class files for
// each removed path in both slash and dot form, 0 hits, and the same scan finds 45 hits for api/IECOTier and 2
// for impl/storage/ECOStorageCell, so the 0 is the scan working. What eco took out is its megacells bulk
// backend (MegaBulkMarkingService, MegaBulkUnits, ECOMegaLongBulkStorageCell*, ECOMegaDecompressionService), a
// dataenergistics bridge, and it put the same idea back in core under impl/storage/bulk - we name none of it
// either way, because the 10-21 cut already removed our side of that coupling.
// Member level: tools/audit_eco_abi.py over classes compiled against 21.2.10 prints 155 lines for the 21.2.10
// control and 156 for 21.2.11. The reading is that single delta, not the length: one line appears.
// ONE REAL BREAK, and it is the kind AGENTS.md §5 warns about. ECOFluidInputHatchBlockEntity.tank changes
// declared type, net.neoforged...FluidTank -> eco's new util/LongFluidTank (a class added this release). Field
// references carry the owner AND an exact descriptor, so a jar built on 21.2.10 that reads that field throws
// NoSuchFieldError on 21.2.11 - and a jar built on 21.2.11 cannot run on 21.2.10. Our four reads of .tank
// (SimplifyFluidInputHatchBlock, SimplifyFluidOutputHatchBlock, and the two Capabilities.FluidHandler.BLOCK
// registrations) all pass the field straight through, so no source line changes, but the floor must move with
// the baseline: neoforge.mods.toml says [21.2.11,) for that descriptor alone.
// Eco's own floors are unchanged - neoforge [21.1.0,), ae2 [19.2.17,), ldlib2 [2.2.40,) - so this sync moves
// nothing else on the table. The only dependency line it touches is an optional one we do not install:
// "Useless Mod" [1.21.1-2.3.7.2,) -> [1.21.1-2.4.6.2,) for eco's LongFluidTank input hatch.
// What 21.2.11 hands us, none of it adopted yet: (1) issue #136 is fixed upstream - grid/PatternCatalog gains
// containsPatternOtherThanSource(Object,AEItemKey,ECOPatternSourceSlot), claimExternalPatternCandidates(...)
// returning IECOPatternStorageService$ExternalPatternClaim, and a 3-argument insertPreparedPatternReporting
// that threads the source slot through; that is the door back for our pattern bus, see AGENTS §15.
// (2) api/me/diagnostics ECOProcessingStatusReader + ECOProcessingTargetProvider - an extension point for
// "a machine is stuck and nothing says so" (AGENTS §15 row 4). (3) bulk marking left the megacells backend for
// eco core (impl/storage/bulk/ECOBulkMarkingService, ECOBulkMarkerMenu, ECOBulkCellActionsPopup), which is the
// other half of that §15 row. (4) LongFluidTank + a whole FluidInputHatchUI family, and a network_pull_card
// item. Unsurveyed: the other ~120 added classes.
// ABI target: eco 21.2.10 (moved 2026-10-25; the previous line of sight was 21.2.9, moved 2026-10-21).
// The jar was re-uploaded the same day (md5 444dcfc3fdab, replacing 5b607afc4446): two entries change,
// recipe/LargeWorkstationRecipeSources and its $LightningBorrowing inner class, and the only thing they do is
// move the LightningKey reference out of the outer class behind loaded("ae2lt") - that was the crash that made
// 21.2.10 need lightning at all. Neither class is named by our bytecode, so the ABI face below is unchanged.
// What the 21.2.9 -> 21.2.10 measurement says (taken against the first 21.2.10 upload, md5 5b607afc4446;
// neither entry that changed in the re-upload is named by our bytecode, so every reading below stands):
// entry-level 1498 -> 1568 classes,
// +72 / -2, and the two removed are ExactAmountCollector$AmountVisitor and LargeWorkstationRecipes$FluidInput,
// neither named by us. Class-level: the 106 neoecoae types our bytecode references all resolve. Member-level:
// tools/audit_eco_abi.py prints the same 155-line list for the 21.2.9 control and for 21.2.10, so no member we
// reference went away - the reading is the equality, not the length (supertype members, <init> and getClass
// are javap artefacts). Non-class entries 4505 -> 4584 with 7 eco textures removed, all under its own
// working_station/controller_formed compat family; our resources name no neoecoae: path at all (CI gate).
// Mixin targets re-checked with javap: onReady, getBuildDefinition, renderFixed(BE,float,PoseStack,
// MultiBufferSource,int,int) and Class.forName in ClientUIBridge.call all keep their shape; the two
// other @Mixins bind AE2 classes, which this sync does not touch. One real break, and it is client-side
// only (the suite never loads a renderer): renderFixed now calls getCable{Connected,Disconnected}Model
// (IECOTier, Block) - the one-argument overloads it used before are no longer called - so those three
// @Redirect targets were re-pointed at the two-argument form.
// New this round and not adopted: eco's addon API v1 (api/extension, api/multiblock, api/power, api/storage,
// api/workstation) and ECOComputationModels.registerCableModel(IECOTier, Block, ...), which could retire
// ECOComputationDriveRendererMixin. Unsurveyed, not worthless.
// Why 21.2.9 and not 21.2.8: the panel channels #125 asked for are not in 21.2.8 - IHostPanelTextureProvider$Part
// still has 5 members there, and 21.2.9 has 12 (COMPUTATION_TIER / COMPUTATION_MARKER / CRAFTING_TIER /
// CRAFTING_MARKER / COMPUTATION_STATUS / COMPUTATION_SWITCH / CRAFTING_MODE) plus the
// getPanelTexture(BlockState, Part, int, boolean, boolean) overload and IECOTier.getPanelAtlas(String).
// Class-level scan over the 104 neoecoae types our bytecode and imports reference: all 104 resolve in both
// 21.2.7 and 21.2.9. Entry-level: 1477 -> 1498 classes, +23 / -2, and neither removed class is one we name
// (the two are ECOComputationCoolingControllerRenderer$1 and a thunderbolt compat inner class). Non-class
// jar entries: 0 removed, so the resource side is a pure addition this round.
// Member-level: python tools/audit_eco_abi.py over classes compiled against 21.2.7 reports the same 151-line
// MISSING list for 21.2.7 (the control), 21.2.8 and 21.2.9 - supertype members, <init> and getClass are
// javap artefacts, so the reading is the equality, not the length.
// Not covered by any of the above: six eco ids we resolve through registries (flux, omni, complex_omni,
// mega_chemical, mega_fluid, mekanism). A jar listing cannot prove a registry entry exists, so those six are
// suite-and-client readings - which is why AGENTS.md says the symbol face is not a verdict.
// ABI target: eco 21.2.7 (moved 2026-10-20; the previous line of sight was 21.2.6, moved 2026-10-16).
// Member-level scan over the 104 neoecoae types we reference: 21.2.6 -> 21.2.7 resolves 104 / 104 in both
// jars and moves members on 7 of them - every removal is a synthetic lambda$... whose numbering shifted,
// and the only additions we can see are IECOTier.getPanelTierName() / getHostMarkerTexture() (both
// defaults) plus ECOTier.getPanelTierName(). Entry-level: 1414 -> 1477 classes, +63 / -0.
// The resource side is NOT a pure addition: 96 png paths arrive and 48 go away, and what goes is eco's own
// textures/block/storage/drive/* family (cell_type, cell_level, the housings). That is why this line is
// here: none of the 25 neoecoae: paths our own resources name falls in the removed set - measured, not
// assumed, because a deleted texture path is invisible to javac and shows up as a missing-texture cube.
// api/me/pattern/** is 16 entries in 21.2.6 and 16 in 21.2.7, so that family arrived with 21.2.5 and is
// still unsurveyed by us.
// Member-level scan over the 104 neoecoae types we reference: 21.2.5 -> 21.2.6 changes none of them, and
// all 104 resolve in both jars. That reference set is the Class constant-pool entries of our own bytecode
// UNION our source imports, and the union is the point: a bare return type, a generic type argument and an
// @Mixin(X.class) value get no Class entry at all, which is exactly the must-resolve position §4.2 of
// AGENTS.md warns about. Four of the 104 are reachable only that way (ECOFastPathDispatchProvider,
// NECraftingCluster, ClientUIBridge, ECOStorageCell) - a pool-only scan would have reported 100.
// Control, so "0 changed" is not a blind scan: the same script over 21.2.3 -> 21.2.4 reports 4 changed
// types - StorageHostUI$CellEntry (gained interactionId, the 14-arg form and the 4-arg atDrive),
// $CellExtractor.extract(BlockPos,UUID,boolean), $Config's lambda over it, ECOUniversalStorageCellItem -
// which is what actually broke the panel that round. 21.2.6 leaves those four where 21.2.5 put them, so the
// handle trap we now work around is still live upstream; the proof for the click path itself is that eco's
// client-side gui/storage/StorageCellGrid$CellSlot.class is byte-identical in the two jars (md5
// 3ab6bb24f88d). That is the class whose onMouseDown returns without a word.
// Entry-level: 1409 -> 1414 class entries (+6 / -1), and 34 of the 1408 entries present in both are
// byte-different. Both batches are one family - the crafting planner's new route search (RouteSearch +
// $Frame, ECOProcessingComponentMatching + $Scope, CraftingPatternBusUI$ShiftQuickMove,
// AEProcessingPatternComponentMixin, the planner/solver classes around them, client/gui/workstation) plus
// data/lang/GuiLangs. The one that went away, crafting/planner/solve/ComponentPlanner$RouteCombinations,
// is not among our 104. Nothing under gui/storage/** or blocks/entity/storage/** moved at all:
// StorageDriveLayout, ComputationDriveLayout, StorageCellGrid and StorageCellGrid$CellSlot are
// byte-identical across the two. We call none of the new family, so the honest word is unsurveyed, not
// worthless: it is the same pattern-semantics neighbourhood the 21.2.5 additions opened, and our pattern
// bus and provider are the addons that would want to be told about it.
// (Holding a version back because it "wedges the game test server" is not a valid reason - retracted once
// already: the same single batch passes on it in 478 ms and 21.2.4 has wedged the full suite too. The
// wedge is the harness's, not the version's.)
// Floor is [21.2.3,) because two constructors kept their class names and changed shape there:
// StorageHostUI.Config gained IntSupplier tier + BooleanSupplier formed (13 -> 15 args) and
// StorageHostActionUI.Config lost the bulk-marking trio (16 -> 13). The panel members we now call -
// StorageHostUI$Config's 19-arg form ending in CellInserter + Supplier<ItemStack> and CellEntry's 12-arg
// form exist in 21.2.3 too, but the 4-arg atDrive does not - it arrives in 21.2.4 together with
// interactionId - so the floor is [21.2.4,), one release behind the baseline rather than three.
// What 21.2.3 also took is eco's own 一键标记 button: StorageHostActionUI.create no longer builds one and
// StorageBulkMarkingIntegration is called only from eco's mega controller - see SimplifyStorageHostBlockEntity.
// GuiTitleProvider (PR #110) and grid.NEMachineLookup (PR #109) are still carried; both are in the 104.
// A sync is certified by compiling against that jar and running the suite. tools/audit_eco_abi.py is a
// companion check, not a verdict -- read its docstring before believing its "MISSING" list.
// 21.2.12 (30 commits past 21.2.11) moved eco's whole impl/storage/** tree to storage/** - 45 renames,
// 23 removed, 23 added by the compare API - and that is what our compile has to follow: our small-bulk
// cell names impl.storage.ECOStorageCell in the return descriptor of the createCellInventory override,
// SimplifyDriveRenderer calls impl.storage.infinite.ECOInfiniteStorageMember.isMember, and one game test
// asserts an exact class identity against the same type. The member-level scan over the 109 types we
// reference reports one absent class plus a wall of supertype false positives, so the compiler is the
// instrument here, as the line above says. What did NOT move: ECOFluidInputHatchBlockEntity.tank is still
// util.LongFluidTank (the reason 21.2.11 forced its floor), crafting/display/terminal/ExactAmountSource is
// still where our endless-cell credential sits, and the infinite sand cell is now registered (3 hits for
// eco_infinite_sand_cell, 0 in 21.2.11) - which is what the milk easter egg's item_exists condition waits
// on, so on this baseline that recipe loads.
// ABI target: eco 21.2.13 (moved 2026-10-31; the previous line of sight was 21.2.12, moved 2026-10-28).
// Jar md5 62e8edb7218c, 4713 -> 4773 entries: +62 / -2 / 92 changed, classes 1695 -> 1711. Both removals are
// anonymous lambdas in integration packages we never name (NEAppRepItems$1, NEMegaRadioactiveItems$1), and the
// class-level scan over the 122 neoecoae types our bytecode references reports 0 missing in this jar. Member
// level: tools/audit_eco_abi.py prints the same 95-line list for the 21.2.12 control and for 21.2.13 - the
// reading is the equality, not the length. Mixin targets re-checked with javap: ClientUIBridge.call and
// FixedBlockEntityRenderers.render(AddSectionGeometryEvent$SectionRenderingContext, BlockPos) keep their
// descriptors, and the interface call our @Redirect guards still sits inside that render at offset 59.
// This round is about the multiblock preview: MultiBlockInfoWrapper grows the stat-row drawing (new
// package-private MultiBlockPreviewInfo + Row, tooltips, a scrolling material offset, a MiniButton style) and
// drops EMI_VERTICAL_RESERVE; the three public constructors our JEI plugin and eco's EMI recipe call are
// unchanged. The rows themselves are picked by instanceof over eco's own concrete classes and the helper is
// package-private, so no addon can add a row - but the page still computes real numbers wherever the required
// items are eco block types. Our computation cores extend ECOComputationParallelCore / ThreadingCore and our
// crafting cores extend ECOCraftingParallelCore / ECOCraftingWorker, so those two L1 pages get
// parallel/memory/threads and speed/batch/workers from SimplifyTier; the storage page does not, because our
// controller is our own NEBlock and our drives are not ECODriveBlock, so it walks the fallback branch and
// lists blocks/materials only.
// The rest of our surface needed no code change, checked class by class over the referenced-and-changed
// intersection (9 types): StorageHostUI is byte-identical, its $Config keeps the 20-arg form we build
// (delegating to the new 22-arg with migrationProgress 0 and an empty Component) and $CellEntry is
// identical; ECOStorageCell's only semantic change is an opt-in branch in saveChanges() - when the
// ISaveProvider implements the new DeferredCellPersistence and can defer, the write moves to the
// tick-end flush, otherwise it calls flushBatchedChanges() exactly as before, and our drive implements
// the old interface only. ECOStorageLifecycleEvents gains that flushDeferred() call, a no-op for us.
// ECOCraftingThread.calculateProgressPerTick is now public static with the same formula (10 + 10*max(0,x)
// clamped to 10..100). NEConfig adds only the two infinite-migration values, NEBlocks only two entries
// (cryogenic casing, smart cooling module) and NEMultiBlocks nothing at all. On the infinite side
// StorageListingDelta is new and only eco's own ECOInfiniteStorage adopts it; our endless cells still sit
// on ExactAmountSource, and ECOInfiniteStorageMember (the drive renderer's check) is byte-identical.
// New and not adopted: the large workstation's smart cooling module (block, BE, SmartCoolingModuleUI, KubeJS
// LargeIntegratedWorkingStationSchema, 11 compat models), JEI MultiblockRecipesGuiMixin (the 19.70
// local-variable-slot VerifyError fix), and the infinite-storage migration machinery under storage/infinite.
    implementation files("neoecobeta/neoecoae-21.2.13.jar")
    // MegaCells 4.11.0 is the supported optional integration version.
    implementation files("libs/megacells-4.11.0.jar")
