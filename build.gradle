plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.3.2'
group = 'cn.dancingsnow.neoecoprototype'

base {
    archivesName = 'neoecoprototype'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    // The addon depends on the public AE2/GuideME/LDLib2 APIs and the
    // Neo ECO AE Extension runtime. The exact local development artifacts
    // are documented in README.md and are intentionally not committed.
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.appeng.io" } // AE2官方maven
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    mavenCentral()
    maven { url 'https://maven.terraformersmc.com/' }
    maven { url 'https://repo.sleeping.town/' }
}

dependencies {
    // Dev loader only; the floor we ship in neoforge.mods.toml stays [21.1.0,). Raised to the newest
    // 21.1.x because AE2 Pattern Disk requires [21.1.241,21.2.0) and eco accepts any [21.1.0,).
    implementation "net.neoforged:neoforge:21.1.251"

    // 三个运行时 mod 全部本地化到 libs/（沙箱/离线构建需要）：
    // AE2: compiled at the floor we ship. eco beta1 demanded 19.2.18 from its side and beta2 withdrew
    // that, so nothing here needs the newer jar. Compiling low makes an 18-only member fail at build
    // time instead of at a player's runtime; the trade is that a member 18 *removed* still compiles
    // here (core.localization.Tooltips lost three public static fields) and would then throw on 18.
    implementation files("libs/ae2-19.2.17.jar")               // AE2 (modId: ae2)
    implementation files("libs/guideme-21.1.1.jar")            // GuideME (AE2 强制依赖, modId: guideme)
    implementation files("libs/ldlib2-neoforge-1.21.1-2.2.40-all.jar")  // LDLib2 (eco 预览运行依赖, modId: ldlib2) - 21.2.1 raised its floor to [2.2.40,)
    implementation "dev.vfyjxf:taffy:1.1.3"
    implementation "org.appliedenergistics.yoga:yoga:1.0.0"
// ABI target: eco 21.2.1, the release beta1 and beta2 led up to, so it still carries our merged PRs:
// cn.dancingsnow.neoecoae.gui.GuiTitleProvider (PR #110) and grid.NEMachineLookup (PR #109).
// GuiTitleProvider is what retires the five lambda-name title redirects above; until the floor moves,
// nothing may call them. Our own floor stays [21.2.1-beta2,) - a release compares above its own
// prerelease, so that wording costs nothing now and kept beta1 out while it mattered.
// What the release did change under us is its LDLib2 floor: [2.2.8,) in beta2, [2.2.40,) here. With 2.2.8
// the loader refuses eco outright and this addon is what reports it, as
// NoClassDefFoundError: cn/dancingsnow/neoecoae/gui/GuiTitleProvider - a downstream symptom, not a missing
// class: the interface is in this jar, and so are all four members our mixins inject into. Six classes did
// this addon names none of them.
// A sync is certified by compiling against that jar and running the suite. tools/audit_eco_abi.py is a
// companion check, not a verdict -- read its docstring before believing its "MISSING" list.
    implementation files("neoecobeta/neoecoae-21.2.1.jar")
    // MegaCells 4.11.0 is the supported optional integration version.
    implementation files("libs/megacells-4.11.0.jar")
    // Dev-runtime only: keep them off the compile classpath but on the runtime classpath.
    // compileOnly alone broke runGameTestServer outright -- with Applied-Mekanistics gone, the
    // mekanismgenerators:reactor_glass inputs sitting in the run/ data fail KubeJS's registry pass
    // (ClassNotFoundException: me.ramidzkh.mekae2.ae2.MekanismKey) and the server never boots.
    // There is no shadow plugin here, so implementation never bundled anything into our jar either;
    // the shipped jar was verified byte-free of all three either way. Same shape as ae2omnicells below.
    compileOnly files("libs/Mekanism-1.21.1-10.7.19.85.jar")
    compileOnly files("libs/Applied-Mekanistics-1.6.3.jar")
    compileOnly files("libs/ae2jeiintegration-1.2.1.jar")
    runtimeOnly files("libs/Mekanism-1.21.1-10.7.19.85.jar")
    runtimeOnly files("libs/Applied-Mekanistics-1.6.3.jar")
    runtimeOnly files("libs/ae2jeiintegration-1.2.1.jar")
    // Optional OmniCells API is needed by the eco-native Omni adapter.
    compileOnly files("libs/ae2omnicells-1.1.6.jar")
    compileOnly files("libs/Registrate-MC1.21.1-1.4.8.jar")
    runtimeOnly files("libs/ae2omnicells-1.1.6.jar")
    // Optional integration: Beyond Dimensions. compileOnly so the addon still builds
    // and runs without it; the cell is registered only when the mod is present.
    compileOnly files("libs/beyonddimensions-1.21.1-neoforge-0.7.30.jar")
    // 可选联动：AE2 Pattern Disk（LGPL-3.0，与 AE2 同许可族）。compileOnly 暴露它的
    // PatternDiskApi/IPatternDiskHost/DiskHostCollector 稳定面，runtimeOnly 只为共存验证。
    compileOnly files("libs/ae2_pattern_disk-0.5.0.jar")
    // Optional at runtime: the local Pattern Disk build requires Jade >= 15.10.6,
    // while the current dev runtime intentionally uses Jade 15.10.4.
    // 可选参考依赖：ExtendedAE（非强制，仅编译期可见，用于对齐其无限元件的处理方式）。
    // 运行时不需要它；当前代码没有引用其类。
    compileOnly files("libs/extendedae-892005-7478960.jar") // ExtendedAE 1.21-2.2.28
    // 可选集成：KubeJS（compileOnly，非强制）。KJSPlugin 仅在 KubeJS 在场时被其自身
    // 加载（kubejs.plugins.txt），本插件本体在无 KubeJS 环境下完全不受影响。
    // Rhino 是 KubeJS 的配套库，编译期需要其注解类（ItemBuilder 继承链）。
    compileOnly files("libs/kubejs-neoforge-2101.7.2-build.377.jar") // KubeJS 2101.7.2-build.377
    compileOnly files("libs/rhino-2101.2.8-build.91.jar") // Rhino 2101.2.8-build.91
    // 开发环境实测 KJS 链路用的运行时依赖；正式分发不需要。
    runtimeOnly files("libs/kubejs-neoforge-2101.7.2-build.377.jar")
    runtimeOnly files("libs/rhino-2101.2.8-build.91.jar")
    // Upstream beta3 uses requiredMods for conditional compat mixin loading;
    // no separate Advanced AE / GeckoLib runtime fallback is required.
    // 开发辅助 mod（与 eco 预览 neweco 同版本）：
    implementation files("libs/jei-1.21.1-neoforge-19.57.0.445.jar")  // JEI: LDLib2 2.2.40 asks [19.51.0.417,), ae2_pattern_disk asks [19.52.0,20.0.0) - this is the one build that clears both
    implementation files("libs/jade-7428884.jar")                      // Jade 🔍 (curse jade-324717:7428884)
    // 可选集成：EMI。compileOnly 只为编译 NeoECOPrototypeEmiPlugin 那一个类；运行时由 run/mods 里
    // 同 md5 的那份提供（e4aede758ec7c675d2255234df7ed4ff），没有 EMI 的环境里这个类根本不会被构造
    // —— EMI 是扫描 @EmiEntrypoint 注解才找到插件的，不像软依赖那样能被我们的主类碰到。
    compileOnly files("libs/emi-1.1.24+1.21.1+neoforge.jar") // EMI 1.1.24+1.21.1+neoforge
    // 可选集成：AppliedFlux（应用通量，modId appflux，作者同 ExtendedAE）。FeStorageIntegration 只在
    // ModList.isLoaded("appflux") 里被引用，所以 compileOnly 就够；运行时那份在 run/mods。
    // 它自己硬依赖 glodium + guideme，容量口径是 flux_cell.amount（默认 1 byte = 1 Mi FE）。
    compileOnly files("libs/appflux-1.21-2.1.5-neoforge.jar") // AppliedFlux 1.21-2.1.5-neoforge

    compileOnly "org.projectlombok:lombok:1.18.34"
    annotationProcessor "org.projectlombok:lombok:1.18.34"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

// Every mod dependency resolves from a local file so a build needs no network, and none of those files
// are committed (see THIRD_PARTY_NOTICES.md). A fresh clone used to fail as a wall of unresolved
// symbols; this names the paths instead. Reading the declarations back out of this file is deliberate:
// a second list would be a second truth and would drift.
def declaredLocalJars = file('build.gradle').readLines().collectMany { line ->
    def matcher = (line =~ /^\s*(?:implementation|compileOnly|runtimeOnly)\s+files\("([^"]+\.jar)"\)/)
    matcher.find() ? [matcher.group(1)] : []
}.unique()
def absentLocalJars = declaredLocalJars.findAll { !file(it).exists() }
if (!absentLocalJars.isEmpty()) {
    throw new GradleException("Missing local dependency JARs, which this repository does not " +
            "redistribute:\n  " + absentLocalJars.join("\n  ") +
            "\nPlace lawful copies of these exact files, then run again. Sources are listed per mod in " +
            "THIRD_PARTY_NOTICES.md; the neoecoae baseline may need to come from its author.")
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

neoForge {
    version = '21.1.251'

    runs {
        client {
            client()
        }
        server {
            server()
            // Own directory, like run-gametest below: the default gameDir is run/, which is the
            // development client's own world, so a server run saves over the world someone is
            // editing. Measured the hard way on 2026-10-07 - run/world/level.dat came back with a
            // server timestamp on it.
            gameDirectory = file('run-server')
        }
        // NeoForge 21.1.251 GameTest server; keep the namespace enabled explicitly.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'neoecoprototype'
            // 隔离运行目录：默认会复用 run/，与开发世界共用同一份 run/world，
            // 被中断的运行会留下 .neoforge-tmp 残留并让后续运行互相争抢（表现为测试卡死）。
            gameDirectory = file('run-gametest')
        }
    }

    mods {
        neoecoprototype {
            sourceSet(sourceSets.main)
        }
    }
}