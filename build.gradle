plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.2.1'
group = 'cn.dancingsnow.neoecoprototype'

base {
    archivesName = 'neoecoprototype'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    mavenLocal()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    // The addon depends on the public AE2/GuideME/LDLib2 APIs and the
    // Neo ECO AE Extension runtime. The exact local development artifacts
    // are documented in README.md and are intentionally not committed.
    maven { url "https://api.modrinth.com/maven" }
    maven { url "https://maven.appeng.io" } // AE2官方maven
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
    mavenCentral()
    maven { url 'https://maven.terraformersmc.com/' }
    maven { url 'https://repo.sleeping.town/' }
}

dependencies {
    implementation "net.neoforged:neoforge:21.1.233"

    // 三个运行时 mod 全部本地化到 libs/（沙箱/离线构建需要）：
    implementation files("libs/ae2-19.2.17.jar")               // AE2 (modId: ae2)
    implementation files("libs/guideme-21.1.1.jar")            // GuideME (AE2 强制依赖, modId: guideme)
    implementation files("libs/ldlib2-2.2.8.jar")              // LDLib2 (eco 预览运行依赖, modId: ldlib2)
    implementation "dev.vfyjxf:taffy:1.1.3"
    implementation "org.appliedenergistics.yoga:yoga:1.0.0"
    // Trinity ABI target: beta3, the current local/published release baseline.
    implementation files("neoecobeta/neoecoae-21.2.0-beta3.jar")
    // MegaCells 4.11.0 is the supported optional integration version.
    implementation files("libs/megacells-4.11.0.jar")
    // Temporary local runtime dependencies for client inspection; restore compileOnly after viewing.
    implementation files("libs/Mekanism-1.21.1-10.7.19.85.jar")
    implementation files("libs/Applied-Mekanistics-1.6.3.jar")
    implementation files("libs/ae2jeiintegration-1.2.1.jar")
    // Optional OmniCells API is needed by the eco-native Omni adapter.
    compileOnly files("libs/ae2omnicells-1.1.6.jar")
    compileOnly files("libs/Registrate-MC1.21.1-1.4.8.jar")
    runtimeOnly files("libs/ae2omnicells-1.1.6.jar")
    // Optional integration: Beyond Dimensions. compileOnly so the addon still builds
    // and runs without it; the cell is registered only when the mod is present.
    compileOnly files("libs/beyonddimensions-1.21.1-neoforge-0.7.30.jar")
    // 可选参考依赖：ExtendedAE（非强制，仅编译期可见，用于对齐其无限元件的处理方式）。
    // 运行时不需要它；当前代码没有引用其类。
    compileOnly files("libs/extendedae-892005-7478960.jar") // ExtendedAE 1.21-2.2.28
    // 可选集成：KubeJS（compileOnly，非强制）。KJSPlugin 仅在 KubeJS 在场时被其自身
    // 加载（kubejs.plugins.txt），本插件本体在无 KubeJS 环境下完全不受影响。
    // Rhino 是 KubeJS 的配套库，编译期需要其注解类（ItemBuilder 继承链）。
    compileOnly files("libs/kubejs-neoforge-2101.7.2-build.377.jar") // KubeJS 2101.7.2-build.377
    compileOnly files("libs/rhino-2101.2.8-build.91.jar") // Rhino 2101.2.8-build.91
    // 开发环境实测 KJS 链路用的运行时依赖；正式分发不需要。
    runtimeOnly files("libs/kubejs-neoforge-2101.7.2-build.377.jar")
    runtimeOnly files("libs/rhino-2101.2.8-build.91.jar")
    // Upstream beta3 uses requiredMods for conditional compat mixin loading;
    // no separate Advanced AE / GeckoLib runtime fallback is required.
    // 开发辅助 mod（与 eco 预览 neweco 同版本）：
    implementation files("libs/jei-1.21.1-neoforge-19.27.0.340.jar")  // JEI (mezz.jei, 19.27.0.340)
    implementation files("libs/jade-7428884.jar")                      // Jade 🔍 (curse jade-324717:7428884)

    compileOnly "org.projectlombok:lombok:1.18.34"
    annotationProcessor "org.projectlombok:lombok:1.18.34"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

neoForge {
    version = '21.1.233'

    runs {
        client {
            client()
        }
        server {
            server()
        }
        // NeoForge 21.1.233 GameTest server; keep the namespace enabled explicitly.
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enableGameTest', 'true'
            systemProperty 'neoforge.enabledGameTestNamespaces', 'neoecoprototype'
            // 隔离运行目录：默认会复用 run/，与开发世界共用同一份 run/world，
            // 被中断的运行会留下 .neoforge-tmp 残留并让后续运行互相争抢（表现为测试卡死）。
            gameDirectory = file('run-gametest')
        }
    }

    mods {
        neoecoprototype {
            sourceSet(sourceSets.main)
        }
    }
}