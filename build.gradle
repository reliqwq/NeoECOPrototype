    compileOnly files("libs/extendedae-892005-7478960.jar") // ExtendedAE 1.21-2.2.28
    // 可选集成：KubeJS（compileOnly，非强制）。KJSPlugin 仅在 KubeJS 在场时被其自身
    // 加载（kubejs.plugins.txt），本插件本体在无 KubeJS 环境下完全不受影响。
    // Rhino 是 KubeJS 的配套库，编译期需要其注解类（ItemBuilder 继承链）。
    compileOnly files("libs/kubejs-neoforge-2101.7.2-build.377.jar") // KubeJS 2101.7.2-build.377
    compileOnly files("libs/rhino-2101.2.8-build.91.jar") // Rhino 2101.2.8-build.91
    // 开发环境实测 KJS 链路用的运行时依赖；正式分发不需要。
    runtimeOnly files("libs/kubejs-neoforge-2101.7.2-build.377.jar")
    runtimeOnly files("libs/rhino-2101.2.8-build.91.jar")
    // Upstream beta3 uses requiredMods for conditional compat mixin loading;
    // no separate Advanced AE / GeckoLib runtime fallback is required.
    // 开发辅助 mod（与 eco 预览 neweco 同版本）：
    implementation files("libs/jei-1.21.1-neoforge-19.57.0.445.jar")  // JEI: LDLib2 2.2.40 asks [19.51.0.417,), ae2_pattern_disk asks [19.52.0,20.0.0) - this is the one build that clears both
    implementation files("libs/jade-7428884.jar")                      // Jade 🔍 (curse jade-324717:7428884)
    // 可选集成：EMI。compileOnly 只为编译 NeoECOPrototypeEmiPlugin 那一个类；运行时由 run/mods 里
    // 同 md5 的那份提供（e4aede758ec7c675d2255234df7ed4ff），没有 EMI 的环境里这个类根本不会被构造
    // —— EMI 是扫描 @EmiEntrypoint 注解才找到插件的，不像软依赖那样能被我们的主类碰到。
    compileOnly files("libs/emi-1.1.24+1.21.1+neoforge.jar") // EMI 1.1.24+1.21.1+neoforge
    // 可选集成：AppliedFlux（应用通量，modId appflux，作者同 ExtendedAE）。FeStorageIntegration 只在
    // ModList.isLoaded("appflux") 里被引用，所以 compileOnly 就够；运行时那份在 run/mods。
    // 它自己硬依赖 glodium + guideme，容量口径是 flux_cell.amount（默认 1 byte = 1 Mi FE）。
    compileOnly files("libs/appflux-1.21-2.1.5-neoforge.jar") // AppliedFlux 1.21-2.1.5-neoforge

    compileOnly "org.projectlombok:lombok:1.18.34"
    annotationProcessor "org.projectlombok:lombok:1.18.34"

    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.mockito:mockito-core:5.15.2"
