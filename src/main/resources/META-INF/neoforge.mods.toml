modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0-only"

[[mods]]
modId = "neoecoprototype"
version = "0.3.1"
displayName = "Neo ECO Prototype"
authors = "reliqwq"
description = "A unified Trinity addon for Neo ECO AE Extension and AE2: multiblock storage, network crafting entry, task diagnostics, and UI below eco's L4 tier."
logoFile = "logo.png"

[[mixins]]
config = "neoecoprototype.mixins.json"

[[dependencies.neoecoprototype]]
modId = "neoforge"
mandatory = true
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.neoecoprototype]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# AE2 floor: 19.2.17, unchanged since 1.2.x and now also the version we compile against - eco
# 21.2.1-beta1 demanded 19.2.18 from its own side and beta2 dropped that back, so nothing needs it.
# Players on 19.2.18 stay covered: the only AE2 class that differs between the two jars is
# core.localization.Tooltips, which lost three public static fields in 19.2.18, and the single member
# we call on it, bytesUsed(long, long), exists in both.
[[dependencies.neoecoprototype]]
modId = "ae2"
mandatory = true
versionRange = "[19.2.17,)"
ordering = "NONE"
side = "BOTH"

# Floor is 21.2.1, the build that carries our merged PRs. This addon's four communication-interface
# and pattern-bus blocks now implement eco.gui.GuiTitleProvider, which decides who owns the GUI header
# (PR #110); on an older eco that interface does not exist, so loading those block classes fails.
# The floor is a prerelease on purpose, and the reason is measured rather than assumed: 21.2.1-beta1
# self-reported plain "21.2.1" so a "[21.2.1,)" range accepted it, but 21.2.1-beta2 reports its real
# version, and a prerelease compares *below* the release - the loader then refused to start with
# "Mod neoecoprototype requires neoecoae 21.2.1 or above / Currently, neoecoae is 21.2.1-beta2".
# "[21.2.1-beta2,)" accepts every later beta and the eventual 21.2.1 final.
# eco 21.2.1-beta1 raised its own AE2 floor to 19.2.18 and the loader enforced that from eco's side;
# beta2 put it back to 19.2.17, so the ae2 range declared above is now the only gate on AE2.
# Do not treat a range as a safety net: 1.2.7 shipped an upper bound that should have excluded
# 21.2.0, a player still loaded it with that eco and got NoSuchMethodError when opening the L1
# storage host GUI. ABI surprises are caught by compiling against the target, not by bounding it.
[[dependencies.neoecoprototype]]
modId = "neoecoae"
mandatory = true
versionRange = "[21.2.1-beta2,)"
ordering = "NONE"
side = "BOTH"

# LDLib2: eco 21.2.1 requires [2.2.40,) from its own side and this addon's GUI code sits on the same
# library, so the floor here is eco's floor verbatim - declaring it changes who refuses, not who can run.
# What that floor is for is measured: with the 2.2.8 jar eco 21.2.1 raised this addon reported
# NoClassDefFoundError: cn/dancingsnow/neoecoae/gui/GuiTitleProvider while loading our block classes,
# which is eco refusing to start, not a class of ours missing.
[[dependencies.neoecoprototype]]
modId = "ldlib2"
mandatory = true
versionRange = "[2.2.40,)"
ordering = "NONE"
side = "BOTH"

# The L1 small-bulk matrix family (item/fluid/chemical) is built on the mega cell
# types and the long-bulk storage backend from neoecoae's MEGA Cells integration;
# without MegaCells the family stays unregistered and the rest of the mod works.
# 4.11.0 is not a floor we invented: it is what eco 21.2.1 declares for this mod, so a player
# running an older MegaCells is refused by eco with or without this entry. Matching it costs
# nothing and puts the refusal under the mod that actually needs it. Range enforcement is real -
# pointing this entry at [9.9.9,) produced "Mod neoecoprototype only supports megacells 9.9.9 or
# above / Currently, megacells is 4.11.0" as a FATAL during pre-loading and the server refused to
# start, which is why a floor here is only ever a version somebody has measured.
[[dependencies.neoecoprototype]]
modId = "megacells"
type = "optional"
versionRange = "[4.11.0,)"
ordering = "AFTER"
side = "BOTH"

# AE2 Omni Cells carries the universal and quantum matrix line (the omni-family matrices built by the
# KubeJS builder and by StorageMatrixBuilder read its cell types). eco 21.2.1 declares this mod as an
# optional dependency at [1.1.6,), and the jar in our development classpath is exactly that build,
# so the range below is eco's wording rather than a floor we picked.
[[dependencies.neoecoprototype]]
modId = "ae2omnicells"
type = "optional"
versionRange = "[1.1.6,)"
ordering = "AFTER"
side = "BOTH"

# AppliedFlux (mod id appflux) carries the flux storage family: our own FE housing
# plus a 1M and a 4M matrix, and the induction card allowance for our interfaces and
# pattern providers. All of it is registered behind ModList.isLoaded("appflux"), so the
# family simply does not exist without the mod - no item, no recipe, no creative entry.
# The range is open on purpose. It is not decoration: an optional entry with a version
# range is enforced the moment the mod is there (measured with the megacells entry above),
# so a floor we never tested - we measured 1.21-2.1.5 and nothing older - would stop people
# running an earlier AppliedFlux from starting the game at all. Presence is the real gate.
[[dependencies.neoecoprototype]]
modId = "appflux"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Two viewer integrations, both behind ModList checks: Jade gets providers for our drives and hosts,
# JEI and EMI get the multiblock and assembler recipe pages. eco 21.2.1 declares both as optional with
# an open range, so an open range here is the same claim - the integration simply does not register
# when the mod is absent, and no version of either mod is excluded.
[[dependencies.neoecoprototype]]
modId = "jade"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.neoecoprototype]]
modId = "jei"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"
