[[mixins]]
config = "neoecoprototype.mixins.json"

[[dependencies.neoecoprototype]]
modId = "neoforge"
mandatory = true
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.neoecoprototype]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

[[dependencies.neoecoprototype]]
modId = "ae2"
mandatory = true
versionRange = "[19.2.17,)"
ordering = "NONE"
side = "BOTH"

# Require the beta line: every preview build carries the older StorageHostUI ABI.
# Maven compares the unknown qualifier "preview" above "beta", so a plain [21.2.0-beta4,)
# range would admit preview10..preview16-hotfix1, which lack the 13-argument
# StorageHostUI.Config constructor and fail at runtime with NoSuchMethodError.
# beta4 is the first build exposing IECOBulkMarkableCellItem used by the small-bulk cells.
[[dependencies.neoecoprototype]]
modId = "neoecoae"
mandatory = true
versionRange = "[21.2.0-beta4,21.2.0-preview)"
ordering = "NONE"
side = "BOTH"

# The L1 small-bulk matrix family (item/fluid/chemical) is built on the mega cell
# types and the long-bulk storage backend from neoecoae's MEGA Cells integration;
# without MegaCells the family stays unregistered and the rest of the mod works.
[[dependencies.neoecoprototype]]
modId = "megacells"
type = "optional"
versionRange = "[4.11.0,)"
ordering = "AFTER"
side = "BOTH"
