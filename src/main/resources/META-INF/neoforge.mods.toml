modLoader = "javafml"
loaderVersion = "[4,)"
license = "GPL-3.0-only"

[[mods]]
modId = "neoecoprototype"
version = "@mod_version@"
displayName = "Neo ECO Prototype"
authors = "reliqwq"
description = "A unified Trinity addon for Neo ECO AE Extension and AE2: multiblock storage, network crafting entry, task diagnostics, and UI below eco's L4 tier."
logoFile = "logo.png"

[[mixins]]
config = "neoecoprototype.mixins.json"

[[dependencies.neoecoprototype]]
modId = "neoforge"
mandatory = true
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.neoecoprototype]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1,1.22)"
ordering = "NONE"
side = "BOTH"

# AE2 floor: 19.2.17, unchanged since 1.2.x and now also the version we compile against - eco
# 21.2.1-beta1 demanded 19.2.18 from its own side and beta2 dropped that back, so nothing needs it.
# Players on 19.2.18 stay covered: the only AE2 class that differs between the two jars is
# core.localization.Tooltips, which lost three public static fields in 19.2.18, and the single member
# we call on it, bytesUsed(long, long), exists in both.
# Ordering is AFTER, not NONE, and issue #6 is why: our own item registration reaches into AE2's
# registry objects (AEItems.SINGULARITY, and AE2's inscriber through eco), and those are only bound by
# AE2's own RegisterEvent. With NONE the loader is free to run us first, which a player only sees as
# "Trying to access unbound value: ResourceKey[minecraft:item / ae2:singularity]" at startup - and it
# was invisible in every pack that also carried MegaCells, because that dependency is AFTER and drags
# AE2 ahead of us.
[[dependencies.neoecoprototype]]
modId = "ae2"
mandatory = true
versionRange = "[19.2.17,)"
ordering = "AFTER"
side = "BOTH"

# Floor is 21.2.4; the addon compiles and tests against 21.2.6. Two of eco's classes are load-bearing
# anyway: gui.common.FluidHatchUI.createFluidHatchUI, which our two fluid hatch blocks call
# (21.2.1 keeps that factory on CraftingUIHelper and has no FluidHatchUI at all, so an older eco would
# throw NoClassDefFoundError the moment a player opened one of those GUIs), and gui.GuiTitleProvider
# (PR #110), implemented by our four communication-interface and pattern-bus blocks to own the GUI
# header. grid.NEMachineLookup (PR #109) is still there, and eco's own 14-entry dependency table parses
# out identical from 21.2.1 through 21.2.6 (modId + type + ordering + versionRange per row -- eco declares
# no "mandatory" key at all, it marks required vs optional with "type"), so no other floor here moves
# with it.
# The floor has two independent reasons and the later one wins. 21.2.3 reshaped two constructors that
# kept their class names: StorageHostUI$Config gained IntSupplier tier + BooleanSupplier formed
# (13 -> 15 args) and StorageHostActionUI$Config lost the bulk-marking trio (16 -> 13), so a 21.2.2
# player would get NoSuchMethodError opening the L1 storage host - the same symptom 1.2.7 shipped.
# Then 21.2.4 is where StorageHostUI$CellEntry gained interactionId together with the 4-arg atDrive
# our rows now call. On 21.2.3 every row would carry a null id, eco's client returns without a word,
# and the panel opens only to ignore every click - so refusing at load is the better outcome.
# 21.2.7 is now the floor for a different reason than the ones above: our host and member blocks
# implement eco's IHostPanelTextureProvider to skin the storage and computation panels, and
# implementing an interface is a must-resolve reference - the class has to be there when our block
# class loads, so on 21.2.4 to 21.2.6 this is a NoClassDefFoundError at registration, not a
# cosmetic miss. (Overriding a default method, which is what getPanelTierName() is, would NOT
# have needed this: an extra method nobody calls is inert on the older jars.)
# 21.2.11 is the floor because it is the baseline we compile against - the rule this file keeps: the
# version that filled in the symbol scan is the version the range starts at, because a range is not what
# catches an ABI surprise. This time the floor is forced by exactly such a surprise: eco re-typed a field
# we read, so our bytecode asks for a descriptor 21.2.10 does not declare (see the dependency below).
# The 21.2.10 line was the other case - a pure addition on the symbol face for us, 106 referenced types
# all resolving and the member audit identical to the 21.2.9 control.
# 21.2.9 is where the panel shape arrived: eco's #125 channels only land there (21.2.8 still carries
# five IHostPanelTextureProvider$Part members, 21.2.9 carries twelve and the five-argument
# getPanelTexture overload), and an enum constant that does not exist yet is a NoSuchFieldError on first
# touch, so the code that reads them cannot claim an older floor.
# Do not treat a range as a safety net: 1.2.7 shipped an upper bound that should have excluded
# 21.2.0, a player still loaded it with that eco and got NoSuchMethodError when opening the L1
# storage host GUI. ABI surprises are caught by compiling against the target, not by bounding it.
[[dependencies.neoecoprototype]]
modId = "neoecoae"
mandatory = true
versionRange = "[21.2.13,)"
# 21.2.13 takes no symbol away from us - the member audit over the types we reference is identical to the
# 21.2.12 control, and the accessor below still exists - so this floor is the baseline rule rather than a
# break: the compile baseline moved, and the runtime floor stays equal to it. What the round buys is the
# rewritten multiblock preview (see build.gradle).
# Forced again, and by the same kind of surprise: 21.2.12 moved eco's impl/storage/** tree to storage/**,
# and our bytecode names two of those classes directly - one in the return descriptor of the
# createCellInventory override, one as a static call in the drive renderer. A moved class is a
# NoClassDefFoundError on the side that still asks for the old name, so the floor cannot stay at 21.2.11
# once the baseline is 21.2.12. The tank field that forced the previous floor is unchanged here.
# The floor is forced, not chosen: eco 21.2.11 re-typed ECOFluidInputHatchBlockEntity.tank from
# a neoforge FluidTank to its own util.LongFluidTank, and a field reference carries that exact
# descriptor, so the four reads of .tank that shipped in 1.4.2 cannot be satisfied by 21.2.10.
# We no longer read that field: this tree reads every hatch tank through getFluidTankHandler(), which
# is new in 21.2.12 (0 declarations in 21.2.10 and 21.2.11, 2 in 21.2.12), so it is the accessor that
# holds this floor now, not the descriptor. See build.gradle.
# AFTER for the same reason as AE2 above: several of our items extend eco's cell items, so binding our
# registry entry loads eco's class and runs its statics, which read eco's and AE2's registries.
ordering = "AFTER"
side = "BOTH"

# LDLib2: eco 21.2.1 requires [2.2.40,) from its own side and this addon's GUI code sits on the same
# library, so the floor here is eco's floor verbatim - declaring it changes who refuses, not who can run.
# What that floor is for is measured: with the 2.2.8 jar eco 21.2.1 raised this addon reported
# NoClassDefFoundError: cn/dancingsnow/neoecoae/gui/GuiTitleProvider while loading our block classes,
# which is eco refusing to start, not a class of ours missing.
[[dependencies.neoecoprototype]]
modId = "ldlib2"
mandatory = true
versionRange = "[2.2.40,)"
ordering = "NONE"
side = "BOTH"

# The L1 small-bulk matrix family (item/fluid/chemical) is built on the mega cell
# types and the long-bulk storage backend from neoecoae's MEGA Cells integration;
# without MegaCells the family stays unregistered and the rest of the mod works.
# 4.11.0 is not a floor we invented: it is what eco 21.2.1 declares for this mod, so a player
# running an older MegaCells is refused by eco with or without this entry. Matching it costs
# nothing and puts the refusal under the mod that actually needs it. Range enforcement is real -
# pointing this entry at [9.9.9,) produced "Mod neoecoprototype only supports megacells 9.9.9 or
# above / Currently, megacells is 4.11.0" as a FATAL during pre-loading and the server refused to
# start, which is why a floor here is only ever a version somebody has measured.
[[dependencies.neoecoprototype]]
modId = "megacells"
type = "optional"
versionRange = "[4.11.0,)"
ordering = "AFTER"
side = "BOTH"

# AE2 Omni Cells carries the universal and quantum matrix line (the omni-family matrices built by the
# KubeJS builder and by StorageMatrixBuilder read its cell types). eco 21.2.1 declares this mod as an
# optional dependency at [1.1.6,), and the jar in our development classpath is exactly that build,
# so the range below is eco's wording rather than a floor we picked.
[[dependencies.neoecoprototype]]
modId = "ae2omnicells"
type = "optional"
versionRange = "[1.1.6,)"
ordering = "AFTER"
side = "BOTH"

# AppliedFlux (mod id appflux) carries the flux storage family: our own FE housing
# plus a 1M and a 4M matrix, and the induction card allowance for our interfaces and
# pattern providers. All of it is registered behind ModList.isLoaded("appflux"), so the
# family simply does not exist without the mod - no item, no recipe, no creative entry.
# The range is open on purpose. It is not decoration: an optional entry with a version
# range is enforced the moment the mod is there (measured with the megacells entry above),
# so a floor we never tested - we measured 1.21-2.1.5 and nothing older - would stop people
# running an earlier AppliedFlux from starting the game at all. Presence is the real gate.
[[dependencies.neoecoprototype]]
modId = "appflux"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# Two viewer integrations, both behind ModList checks: Jade gets providers for our drives and hosts,
# JEI and EMI get the multiblock and assembler recipe pages. eco 21.2.1 declares both as optional with
# an open range, so an open range here is the same claim - the integration simply does not register
# when the mod is absent, and no version of either mod is excluded.
[[dependencies.neoecoprototype]]
modId = "jade"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

[[dependencies.neoecoprototype]]
modId = "jei"
type = "optional"
versionRange = "*"
ordering = "AFTER"
side = "BOTH"

# AE2 Pattern Disk (mod id ae2_pattern_disk): pattern disks can be stored in our L1 pattern bus and written
# through our F1 interface. We reference none of its classes and order nothing on it - the whole linkage
# lives in the two eco block entities our own registrations instantiate verbatim
# (ECOCraftingPatternBusBlockEntity and ECOMachineInterfaceBlockEntity), and eco's PatternCatalog is what
# indexes a disk's patterns (indexAuxiliaryPatterns, busAuxiliaryPatternKeys). The entry is here to mark
# that inherited interaction for pack authors, measured 2026-10-23 on 0.9.3 with zero warning lines: eco
# logs "hosts that opt in" and the disk mod logs "Encoding terminal upload button wired".
# Open range, same reasoning as appflux above: a floor we did not test would stop an older build starting
# the game, while the actual version gate is eco's own - with 0.5.0 eco says the api has no removeAt() and
# stands its integration down by itself. 0.9.3 in turn requires ae2wtlib [19.5.0,) and guideme, which are
# its own entries, not ours.
[[dependencies.neoecoprototype]]
modId = "ae2_pattern_disk"
type = "optional"
versionRange = "*"
ordering = "NONE"
side = "BOTH"
